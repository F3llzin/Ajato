<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo agendamento | Ajato</title>
    <link rel="shortcut icon" href="../../assets/img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../css/novo-agendamento.css">
</head>
<body>
    <header>
        <img src="../../assets/img/logo-ajato - Copia.png" alt="Logo do Ajato">
    </header>
    <main>
        <div></div>
        <div>
            <a href="servicos.html">&lt Voltar aos Serviços</a>
            <p id="p1">NOVO ATENDIMENTO</p>
            <h1>Cadastrar agendamento</h1>
            <p>Os campos marcados com * são obrigatórios.</p>
            <div id="historico">
                <div class="agendamento-formulario">
                    <p class="formulario-rotulo">Tipo de cadastro</p>
                    <div id="tipo-cadastro">
                        <a href="" class="nao-clicavel">Pessoa Física - CPF</a>
                        <a href="novo-agendamento-cnpj.html" class="clicavel">Pessoa Jurídica - CNPJ</a>
                    </div>

                    <form action="" autocomplete="on">
                        <div class="formulario-grade">
                        <div class="formulario-campo">
                            <label for="inome">Nome*</label>
                            <input type="text" name="nome" id="inome" placeholder="Nome completo" required>
                        </div>
                        <div class="formulario-campo">
                            <label for="idata">Data de Nascimento</label>
                            <input type="date" name="data" id="idata">
                        </div>
                        <div class="formulario-campo">
                            <label for="icpf">CPF*</label>
                            <input type="number" name="cpf" id="icpf" placeholder="000.000.000-00" required>
                        </div>
                        <div class="formulario-campo">
                            <label for="itelefone">Telefone*</label>
                            <input type="number" name="telefone" id="itelefone" placeholder="(00) 00000-0000" required>
                            <label class="formulario-whatsapp" for="itw">
                                <input type="checkbox" name="tw" id="itw">
                                Esse número também é WhatsApp
                            </label>
                        </div>
                        </div>

                        <hr class="formulario-divisoria">
                        <p class="formulario-titulo-secao">Dados do veículo e serviço</p>

                        <div class="formulario-grade">
                        <div class="formulario-campo">
                            <label for="iplaca">Placa*</label>
                            <input type="text" name="placa" id="iplaca" placeholder="ABC-1234" required>
                        </div>
                        <div class="formulario-campo">
                            <label for="imveiculo">Modelo do veículo*</label>
                            <input type="text" name="mveiculo" id="imveiculo" placeholder="Ex.: Toyota Corolla" required>
                        </div>
                        <div class="formulario-campo">
                            <label for="icveiculo">Cor do veículo</label>
                            <input type="text" name="cveiculo" id="icveiculo" placeholder="Ex.: Branco" required>
                        </div>
                        </div>

                        <div class="formulario-lavagens">
                            <p class="formulario-legenda">Tipo de lavagem*</p>
                            <div class="formulario-opcoes">
                                <label class="formulario-opcao" for="ils">
                                    <input type="checkbox" name="ls" id="ils"> Lavagem simples
                                </label>
                                <label class="formulario-opcao" for="ilc">
                                    <input type="checkbox" name="lc" id="ilc"> Lavagem composta
                                </label>
                                <label class="formulario-opcao" for="ih">
                                    <input type="checkbox" name="h" id="ih"> Higienização
                                </label>
                            </div>
                        </div>

                        <div class="formulario-campo formulario-adicional">
                            <label for="isa">Serviço adicional</label>
                            <input type="text" placeholder="Ex.: Enceramento, polimento ou outro serviço" id="isa" name="sa">
                        </div>

                        <button type="submit" class="formulario-enviar">Cadastrar agendamento</button>
                    </form>
                </div>

            </div>
        </div>
        <div></div>
    </main>
    <footer>
        <nav>

        </nav>
    </footer>
</body>
</html>
